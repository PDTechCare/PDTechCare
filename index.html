<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>PD TechCare</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background:#f3f4f6;
 color:#111;
}
header{
 background:#111;
 color:#fff;
 padding:17px;
 position:sticky;
 top:0;
 z-index:20;
}
.logo{
 font-size:25px;
 font-weight:900;
}
.logo span{color:#f5c400}
.clock{
 float:right;
 color:#ccc;
 font-size:12px;
 margin-top:8px;
}
main{
 max-width:1100px;
 margin:auto;
 padding:14px;
}
.tabs{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding-bottom:5px;
}
.tabs button{
 border:0;
 background:#fff;
 padding:12px 14px;
 border-radius:13px;
 white-space:nowrap;
 font-weight:700;
}
.tabs button.active{
 background:#111;
 color:#fff;
}
.hidden{display:none!important}
h1{
 font-size:27px;
 margin:12px 0 17px;
}
h2{margin-top:0}
.card{
 background:#fff;
 border-radius:18px;
 padding:17px;
 margin-bottom:15px;
 box-shadow:0 2px 12px #0000000b;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.stat{
 background:#fff;
 padding:17px;
 border-radius:17px;
}
.stat small{color:#777}
.stat strong{
 display:block;
 font-size:27px;
 margin-top:5px;
}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
label{
 display:block;
 font-size:14px;
 font-weight:700;
 margin:12px 0 6px;
}
input,select,textarea{
 width:100%;
 border:1px solid #ddd;
 border-radius:11px;
 padding:13px;
 font-size:16px;
 background:#fff;
}
textarea{min-height:85px}
.btn{
 border:0;
 border-radius:11px;
 padding:11px 14px;
 font-weight:800;
 font-size:14px;
 background:#eee;
}
.primary{
 background:#f5c400;
 color:#111;
}
.dark{
 background:#111;
 color:#fff;
}
.success{
 background:#dff6e6;
 color:#126b37;
}
.blue{
 background:#e4efff;
 color:#175ba8;
}
.danger{
 background:#ffe2e2;
 color:#a40018;
}
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:13px;
}
.item{
 background:#fff;
 border:1px solid #e8e8e8;
 border-radius:16px;
 padding:15px;
 margin:10px 0;
}
.top{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
}
.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 font-weight:800;
 background:#fff0ae;
}
.badge.done{
 background:#dff6e6;
 color:#126b37;
}
.badge.returned{
 background:#e2edff;
 color:#175ba8;
}
.badge.waiting{
 background:#ffe9c7;
 color:#9a5a00;
}
.time{
 color:#777;
 font-size:12px;
 margin-top:5px;
}
.member{
 border:1px solid #eee;
 border-radius:15px;
 padding:15px;
 margin:10px 0;
}
.member-head{
 display:flex;
 gap:12px;
 align-items:center;
}
.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 background:#f5c400;
 display:grid;
 place-items:center;
 font-weight:900;
}
.active{
 background:#dff6e6;
 color:#126b37;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
}
.locked{
 background:#eee;
 color:#666;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
}
.empty{
 padding:25px;
 text-align:center;
 color:#777;
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:100;
 align-items:flex-end;
}
.modal.show{display:flex}
.sheet{
 background:#fff;
 width:100%;
 max-height:94vh;
 overflow:auto;
 border-radius:22px 22px 0 0;
 padding:18px;
}
.receipt{
 max-width:700px;
 margin:auto;
}
.receipt-title{
 text-align:center;
 font-size:27px;
 font-weight:900;
}
.receipt-title span{color:#f5c400}
.line{
 border-top:1px dashed #888;
 margin:15px 0;
}
.receipt table{
 width:100%;
 border-collapse:collapse;
}
.receipt td{
 padding:7px 0;
 vertical-align:top;
}
.right{text-align:right}
.total{
 font-size:21px;
 font-weight:900;
}
.filter{
 display:flex;
 gap:8px;
 overflow:auto;
 margin:10px 0;
}
.filter button{
 border:0;
 padding:9px 12px;
 border-radius:20px;
 background:#eee;
 white-space:nowrap;
 font-weight:700;
}
.filter button.active{
 background:#111;
 color:#fff;
}
@media(min-width:700px){
 .grid{grid-template-columns:repeat(4,1fr)}
 .modal{align-items:center}
 .sheet{
  max-width:760px;
  border-radius:22px;
 }
}
@media(max-width:600px){
 .row{grid-template-columns:1fr}
}
@media print{
 header,.tabs,.no-print{display:none!important}
 body{background:#fff}
}
</style>
</head>

<body>

<header>
 <span class="logo">PD <span>TechCare</span></span>
 <span class="clock" id="clock"></span>
</header>

<main>

<div class="tabs">

<button class="active" onclick="showPage('home',this)">
🏠 Tổng quan
</button>

<button onclick="showPage('new',this)">
➕ Tiếp nhận
</button>

<button onclick="showPage('repair',this)">
🛠️ Quản lý sửa chữa
</button>

<button onclick="showPage('list',this)">
📋 Tất cả phiếu
</button>

<button onclick="showPage('members',this)">
👥 Thành viên
</button>

</div>


<!-- TỔNG QUAN -->

<section id="home">

<h1>PD TechCare</h1>

<div class="grid">

<div class="stat">
<small>🟡 Đang sửa</small>
<strong id="doing">0</strong>
</div>

<div class="stat">
<small>🟢 Đã xong</small>
<strong id="done">0</strong>
</div>

<div class="stat">
<small>🔵 Đã trả</small>
<strong id="returned">0</strong>
</div>

<div class="stat">
<small>💰 Doanh thu</small>
<strong id="revenue">0đ</strong>
</div>

</div>

<div class="card">

<h2>🛠️ Máy đang sửa</h2>

<div id="homeRepair"></div>

</div>

<div class="card">

<h2>📋 Phiếu gần đây</h2>

<div id="recent"></div>

</div>

</section>


<!-- TIẾP NHẬN -->

<section id="new" class="hidden">

<h1>➕ Tiếp nhận sửa chữa</h1>

<div class="card">

<div class="row">

<div>
<label>Mã phiếu</label>
<input id="code" readonly>
</div>

<div>
<label>Ngày nhận</label>
<input id="date" type="date">
</div>

</div>

<div class="row">

<div>
<label>Tên khách hàng *</label>
<input id="customer" placeholder="Nguyễn Văn A">
</div>

<div>
<label>Số điện thoại *</label>
<input id="phone" type="tel" placeholder="09xxxxxxxx">
</div>

</div>

<div class="row">

<div>
<label>Hãng</label>

<select id="brand">
<option>Apple</option>
<option>Samsung</option>
<option>OPPO</option>
<option>Vivo</option>
<option>Xiaomi</option>
<option>Realme</option>
<option>Honor</option>
<option>Huawei</option>
<option>Nokia</option>
<option>Khác</option>
</select>

</div>

<div>
<label>Model</label>
<input id="model" placeholder="iPhone 15 Pro Max">
</div>

</div>

<div class="row">

<div>
<label>IMEI / Serial</label>
<input id="imei">
</div>

<div>
<label>Mật khẩu máy</label>
<input id="password">
</div>

</div>

<label>Tình trạng máy</label>

<textarea id="condition"
placeholder="Nứt kính, bể màn, máy không lên nguồn..."></textarea>

<label>Nội dung sửa chữa</label>

<textarea id="repair"
placeholder="Ép kính, thay màn, thay pin..."></textarea>

<div class="row">

<div>
<label>Tiền linh kiện</label>
<input id="parts" type="number" value="0">
</div>

<div>
<label>Tiền công</label>
<input id="labor" type="number" value="0">
</div>

</div>

<div class="row">

<div>
<label>Đã cọc</label>
<input id="deposit" type="number" value="0">
</div>

<div>
<label>Kỹ thuật viên</label>
<select id="technician"></select>
</div>

</div>

<label>Ghi chú</label>
<input id="note" placeholder="Ghi chú cho kỹ thuật viên...">

<div class="actions">

<button class="btn primary"
onclick="saveTicket()">
💾 Tạo phiếu
</button>

<button class="btn"
onclick="resetForm()">
Hủy
</button>

</div>

</div>

</section>


<!-- QUẢN LÝ SỬA CHỮA -->

<section id="repair" class="hidden">

<h1>🛠️ Quản lý sửa chữa</h1>

<div class="card">

<div class="filter">

<button class="active"
onclick="setRepairFilter('all',this)">
Tất cả
</button>

<button onclick="setRepairFilter('Đang sửa',this)">
🟡 Đang sửa
</button>

<button onclick="setRepairFilter('Đã xong',this)">
🟢 Đã xong
</button>

<button onclick="setRepairFilter('Đã trả',this)">
🔵 Đã trả
</button>

</div>

<input
id="repairSearch"
placeholder="🔍 Tìm khách, SĐT, IMEI, mã phiếu..."
oninput="renderRepair()">

<div id="repairList"></div>

</div>

</section>


<!-- TẤT CẢ PHIẾU -->

<section id="list" class="hidden">

<h1>📋 Tất cả phiếu</h1>

<div class="card">

<input
id="search"
placeholder="🔍 Tìm kiếm..."
oninput="renderList()">

<div id="listbox"></div>

</div>

</section>


<!-- THÀNH VIÊN -->

<section id="members" class="hidden">

<h1>👥 Quản lý thành viên</h1>

<div class="card">

<h2>➕ Tạo thành viên</h2>

<div class="row">

<div>
<label>Họ và tên *</label>
<input id="memberName" placeholder="Nguyễn Văn B">
</div>

<div>
<label>Số điện thoại</label>
<input id="memberPhone" type="tel">
</div>

</div>

<div class="row">

<div>
<label>Vai trò</label>

<select id="memberRole">

<option>Kỹ thuật viên</option>
<option>Nhân viên tiếp nhận</option>
<option>Thu ngân</option>
<option>Quản lý</option>
<option>Quản trị viên</option>

</select>

</div>

<div>
<label>Tài khoản</label>
<input id="memberUsername" placeholder="kythuat01">
</div>

</div>

<div class="row">

<div>
<label>Mật khẩu</label>
<input id="memberPassword" type="password">
</div>

<div>
<label>Trạng thái</label>

<select id="memberStatus">
<option>Đang hoạt động</option>
<option>Tạm khóa</option>
</select>

</div>

</div>

<div class="actions">

<button class="btn primary"
onclick="addMember()">
💾 Thêm thành viên
</button>

<button class="btn"
onclick="clearMemberForm()">
Hủy
</button>

</div>

</div>


<div class="card">

<h2>📋 Danh sách thành viên</h2>

<input
id="memberSearch"
placeholder="🔍 Tìm thành viên..."
oninput="renderMembers()">

<div id="memberList"></div>

</div>

</section>

</main>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="sheet">

<div class="actions no-print">

<button class="btn"
onclick="closeModal()">
Đóng
</button>

<button class="btn primary"
onclick="window.print()">
🖨️ In / Lưu PDF
</button>

</div>

<div id="receipt"></div>

</div>

</div>


<script>

const TICKET_KEY="PDTC_TICKETS_V3";
const MEMBER_KEY="PDTC_MEMBERS_V3";

let tickets=
JSON.parse(localStorage.getItem(TICKET_KEY)||"[]");

let members=
JSON.parse(localStorage.getItem(MEMBER_KEY)||"[]");

let repairFilter="all";


function $(id){
return document.getElementById(id);
}


function money(n){

return Number(n||0)
.toLocaleString("vi-VN")+"đ";

}


function escapeHTML(text){

return String(text??"")
.replace(/[&<>"']/g,function(c){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];

});

}


function saveTickets(){

localStorage.setItem(
TICKET_KEY,
JSON.stringify(tickets)
);

}


function saveMembers(){

localStorage.setItem(
MEMBER_KEY,
JSON.stringify(members)
);

}


function nextTicketCode(){

let max=0;

tickets.forEach(t=>{

let n=
parseInt(
String(t.code||"")
.replace("PD-","")
);

if(n>max)max=n;

});

return "PD-"+
String(max+1).padStart(5,"0");

}


function nextMemberCode(){

let max=0;

members.forEach(m=>{

let n=
parseInt(
String(m.code||"")
.replace("TV-","")
);

if(n>max)max=n;

});

return "TV-"+
String(max+1).padStart(4,"0");

}


function showPage(page,button){

document
.querySelectorAll("main section")
.forEach(x=>x.classList.add("hidden"));

$(page).classList.remove("hidden");


document
.querySelectorAll(".tabs button")
.forEach(x=>x.classList.remove("active"));

if(button)button.classList.add("active");


if(page==="new")resetForm();

if(page==="repair")renderRepair();

if(page==="list")renderList();

if(page==="members")renderMembers();

updateStats();

window.scrollTo(0,0);

}


function resetForm(){

$("code").value=nextTicketCode();

$("date").value=
new Date().toISOString().slice(0,10);

$("customer").value="";
$("phone").value="";
$("model").value="";
$("imei").value="";
$("password").value="";
$("condition").value="";
$("repair").value="";
$("parts").value=0;
$("labor").value=0;
$("deposit").value=0;
$("note").value="";

fillTechnicians();

}


function fillTechnicians(){

let active=
members.filter(
m=>m.status==="Đang hoạt động"
);

$("technician").innerHTML=
'<option value="">— Chưa phân công —</option>'+
active.map(m=>
`<option value="${m.id}">
${escapeHTML(m.name)}
 · ${escapeHTML(m.role)}
</option>`
).join("");

}


function saveTicket(){

let customer=
$("customer").value.trim();

let phone=
$("phone").value.trim();


if(!customer||!phone){

alert(
"Vui lòng nhập tên và SĐT khách hàng."
);

return;

}


let parts=
Number($("parts").value||0);

let labor=
Number($("labor").value||0);

let deposit=
Number($("deposit").value||0);

let now=
new Date().toISOString();

let ticket={

id:Date.now(),

code:$("code").value,

date:$("date").value,

customer:customer,

phone:phone,

brand:$("brand").value,

model:$("model").value.trim(),

imei:$("imei").value.trim(),

password:$("password").value,

condition:$("condition").value.trim(),

repair:$("repair").value.trim(),

parts:parts,

labor:labor,

deposit:deposit,

total:parts+labor,

balance:
Math.max(parts+labor-deposit,0),

status:"Đang sửa",

technician:$("technician").value,

note:$("note").value.trim(),

receivedAt:now,

completedAt:null,

returnedAt:null

};


tickets.unshift(ticket);

saveTickets();

alert(
"Đã tạo phiếu "+ticket.code+
"\nTrạng thái: Đang sửa"
);

showPage("repair");

}


function memberName(id){

let m=
members.find(x=>x.id===id);

return m?
m.name:
"Chưa phân công";

}


function formatDateTime(date){

if(!date)return"-";

return new Date(date)
.toLocaleString("vi-VN");

}


function setRepairFilter(filter,button){

repairFilter=filter;

document
.querySelectorAll(".filter button")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

renderRepair();

}


function renderRepair(){

let search=
($("repairSearch").value||"")
.toLowerCase()
.trim();


let list=
tickets.filter(t=>{

let okFilter=
repairFilter==="all"||
t.status===repairFilter;

let text=
(
t.code+
" "+
t.customer+
" "+
t.phone+
" "+
t.model+
" "+
t.imei+
" "+
memberName(t.technician)
)
.toLowerCase();

return okFilter&&text.includes(search);

});


if(!list.length){

$("repairList").innerHTML=
'<div class="empty">Không có máy phù hợp.</div>';

return;

}


$("repairList").innerHTML=
list.map(repairCard).join("");

}


function repairCard(t){

let badge="";

if(t.status==="Đã xong"){
badge='<span class="badge done">🟢 Đã xong</span>';
}

else if(t.status==="Đã trả"){
badge='<span class="badge returned">🔵 Đã trả</span>';
}

else{
badge='<span class="badge">🟡 Đang sửa</span>';
}


let buttons="";


if(t.status==="Đang sửa"){

buttons+=`

<button
class="btn success"
onclick="completeRepair(${t.id})">

✅ Hoàn thành sửa chữa

</button>

`;

}


if(t.status==="Đã xong"){

buttons+=`

<button
class="btn blue"
onclick="returnCustomer(${t.id})">

📦 Đã trả khách

</button>

`;

}


buttons+=`

<button
class="btn"
onclick="viewTicket(${t.id})">

🧾 Xem phiếu

</button>

`;


return `

<div class="item">

<div class="top">

<b>
${escapeHTML(t.code)}
 ·
${escapeHTML(t.customer)}
</b>

${badge}

</div>

<p>
📱
${escapeHTML(t.brand)}
 ${escapeHTML(t.model)}
</p>

<p>
📞 ${escapeHTML(t.phone)}
</p>

<p>
👨‍🔧 KTV:
<b>
${escapeHTML(memberName(t.technician))}
</b>
</p>

<p>
🔧 ${escapeHTML(t.repair||"Chưa nhập nội dung sửa")}
</p>

<div class="time">
🕒 Tiếp nhận:
${formatDateTime(t.receivedAt)}
</div>

${
t.completedAt
?
`<div class="time">
✅ Hoàn thành:
${formatDateTime(t.completedAt)}
</div>`
:""
}

${
t.returnedAt
?
`<div class="time">
📦 Trả khách:
${formatDateTime(t.returnedAt)}
</div>`
:""
}

<p>
💰 Tổng:
<b>${money(t.total)}</b>
 · Còn:
<b>${money(t.balance)}</b>
</p>

<div class="actions">

${buttons}

<button
class="btn danger"
onclick="deleteTicket(${t.id})">

🗑️ Xóa

</button>

</div>

</div>

`;

}


function completeRepair(id){

let t=
tickets.find(x=>x.id===id);

if(!t)return;


if(t.status!=="Đang sửa")return;


if(
!confirm(
"Xác nhận máy "+t.code+
" đã sửa xong?"
)
)return;


t.status="Đã xong";

t.completedAt=
new Date().toISOString();


saveTickets();

updateStats();

renderRepair();

alert(
"✅ Đã hoàn thành sửa chữa!"
);

}


function returnCustomer(id){

let t=
tickets.find(x=>x.id===id);

if(!t)return;


if(t.status!=="Đã xong")return;


if(
!confirm(
"Xác nhận đã giao máy cho khách?"
)
)return;


t.status="Đã trả";

t.returnedAt=
new Date().toISOString();


saveTickets();

updateStats();

renderRepair();

alert(
"📦 Đã ghi nhận trả máy cho khách."
);

}


function renderList(){

let search=
($("search").value||"")
.toLowerCase()
.trim();


let list=
tickets.filter(t=>{

let text=
Object.values(t)
.join(" ")
.toLowerCase();

return text.includes(search)||
memberName(t.technician)
.toLowerCase()
.includes(search);

});


if(!list.length){

$("listbox").innerHTML=
'<div class="empty">Chưa có phiếu.</div>';

return;

}


$("listbox").innerHTML=
list.map(t=>`

<div class="item">

<div class="top">

<b>
${escapeHTML(t.code)}
 ·
${escapeHTML(t.customer)}
</b>

<span class="badge
${t.status==="Đã xong"?"done":""}
${t.status==="Đã trả"?"returned":""}">
${escapeHTML(t.status)}
</span>

</div>

<p>
📱 ${escapeHTML(t.brand)}
 ${escapeHTML(t.model)}
</p>

<p>
📞 ${escapeHTML(t.phone)}
</p>

<p>
👨‍🔧 ${escapeHTML(memberName(t.technician))}
</p>

<p>
💰 ${money(t.total)}
</p>

<div class="actions">

<button
class="btn"
onclick="viewTicket(${t.id})">
🧾 Xem
</button>

</div>

</div>

`).join("");

}

function addMember(){

let name=
$("memberName").value.trim();


if(!name){

alert("Vui lòng nhập họ tên.");

return;

}


let username=
$("memberUsername").value.trim();


if(
username &&
members.some(
m=>
(m.username||"").toLowerCase()===
username.toLowerCase()
)
){

alert("Tài khoản đã tồn tại.");

return;

}


let member={

id:"M"+Date.now(),

code:nextMemberCode(),

name:name,

phone:
$("memberPhone").value.trim(),

role:
$("memberRole").value,

username:username,

password:
$("memberPassword").value,

status:
$("memberStatus").value,

createdAt:
new Date().toISOString()

};


members.unshift(member);

saveMembers();

clearMemberForm();

fillTechnicians();

renderMembers();

updateStats();

alert(
"Đã thêm thành viên "+
member.name
);

}

"Đang hoạt động";

}


function renderMembers(){

let search=
($("memberSearch").value||"")
.toLowerCase()
.trim();


let list=
members.filter(m=>

(
m.code+" "+
m.name+" "+
m.phone+" "+
m.role+" "+
m.username
)
.toLowerCase()
.includes(search)

);


if(!list.length){

$("memberList").innerHTML=
'<div class="empty">Chưa có thành viên.</div>';

return;

}


$("memberList").innerHTML=
list.map(m=>{

let initials=
m.name
.trim()
.split(/\s+/)
.slice(-2)
.map(x=>x[0])
.join("")
.toUpperCase();


return `

<div class="member">

<div class="top">

<div class="member-head">

<div class="avatar">
${escapeHTML(initials)}
</div>

<div>

<b>${escapeHTML(m.name)}</b>

<div class="time">
${escapeHTML(m.code)}
 ·
${escapeHTML(m.role)}
</div>

</div>

</div>

<span class="${
m.status==="Đang hoạt động"
?"active"
:"locked"
}">
${escapeHTML(m.status)}
</span>

</div>

📞 ${escapeHTML(m.phone||"Chưa có SĐT")}
</p>

<p class="time">
👤 ${escapeHTML(m.username||"Chưa có tài khoản")}
</p>

<div class="actions">

<button
class="btn"
onclick="editMember('${m.id}')">
✏️ Sửa
</button>

<button
class="btn"
onclick="toggleMember('${m.id}')">

${
m.status==="Đang hoạt động"
?"🔒 Tạm khóa"
:"🔓 Mở lại"
}

</button>

<button
class="btn danger"
onclick="deleteMember('${m.id}')">
🗑️ Xóa
</button>

</div>

</div>

`;

}).join("");

}


function editMember(id){

let m=
members.find(x=>x.id===id);

if(!m)return;


let name=
prompt("Họ và tên:",m.name);

if(name===null)return;


let phone=
prompt("Số điện thoại:",m.phone||"");

if(phone===null)return;


let role=
prompt("Vai trò:",m.role);

if(role===null)return;


let username=
prompt("Tài khoản:",m.username||"");

if(username===null)return;


m.name=name.trim()||m.name;
m.phone=phone.trim();
m.role=role.trim()||m.role;
m.username=username.trim();


let password=
prompt(
"Mật khẩu mới, bỏ trống nếu giữ nguyên:",
""
);


if(password){
m.password=password;
}


saveMembers();

fillTechnicians();

renderMembers();

updateStats();

}


function toggleMember(id){

let m=
members.find(x=>x.id===id);

if(!m)return;


m.status=
m.status==="Đang hoạt động"
?"Tạm khóa"
:"Đang hoạt động";


saveMembers();

fillTechnicians();

renderMembers();

updateStats();

}


function deleteMember(id){

let m=
members.find(x=>x.id===id);

if(!m)return;


if(
!confirm(
"Xóa thành viên "+m.name+"?"
)
)return;


members=
members.filter(x=>x.id!==id);


tickets.forEach(t=>{

if(t.technician===id){
t.technician="";
}

});


saveMembers();

saveTickets();

fillTechnicians();

renderMembers();

updateStats();

renderRepair();

}


/* THỐNG KÊ */

function updateStats(){

$("doing").textContent=
tickets.filter(
t=>t.status==="Đang sửa"
).length;


$("done").textContent=
tickets.filter(
t=>t.status==="Đã xong"
).length;


$("returned").textContent=
tickets.filter(
t=>t.status==="Đã trả"
).length;


let revenue=
tickets
.filter(
t=>t.status==="Đã trả"
)
.reduce(
(sum,t)=>sum+t.total,
0
);


$("revenue").textContent=
money(revenue);


$("memberCount").textContent=
members.filter(
m=>m.status==="Đang hoạt động"
).length;


let repair=
tickets.filter(
t=>t.status==="Đang sửa"
).slice(0,5);


$("homeRepair").innerHTML=
repair.length
?
repair.map(repairCard).join("")
:
'<div class="empty">🎉 Không có máy đang sửa.</div>';


let recent=
tickets.slice(0,5);


$("recent").innerHTML=
recent.length
?
recent.map(repairCard).join("")
:
'<div class="empty">Chưa có phiếu.</div>';

}
